name: Personal LiveKit App requests and RTC
on:
  workflow_dispatch:
    inputs:
      label:
        description: Measurement label
        default: personal-baseline
      turns:
        description: Conversational rounds
        type: choice
        options: ['1', '3', '10']
        default: '10'
      behavior:
        description: Check interruption and reconnect
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: fast-request-voice-test
  cancel-in-progress: false
jobs:
  requests-and-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test production App TokenSource and obtain private runtime credentials
        env:
          VOICE_TEST_CONFIG: ${{ secrets.PERSONAL_VOICE_TEST_CONFIG }}
          RESOLVED_CONNECTION_FILE: ${{ runner.temp }}/resolved-connection.json
        run: |
          python - <<'PY'
          import json, os
          config = json.loads(os.environ['VOICE_TEST_CONFIG'])
          for secret in (config['token_endpoint'], config['tts']['api_key']):
              print('::add-mask::' + secret)
          PY
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon
          test -s "$RUNNER_TEMP/resolved-connection.json"
      - name: Install headless RTC client in Actions
        run: python -m pip install 'livekit==1.1.20' 'aiohttp==3.13.3'
      - name: Measure real RTC and streaming providers with fictional speech
        env:
          VOICE_TEST_CONFIG: ${{ secrets.PERSONAL_VOICE_TEST_CONFIG }}
          RESOLVED_CONNECTION_FILE: ${{ runner.temp }}/resolved-connection.json
          VOICE_TEST_TURNS: ${{ inputs.turns }}
          VOICE_TEST_LABEL: ${{ inputs.label }}
          VOICE_TEST_BEHAVIOR: ${{ inputs.behavior }}
        run: python .github/scripts/personal-voice-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-voice-${{ inputs.label }}
          path: |
            voice-reports/
            app/build/reports/tests/
            app/build/reports/connection-request.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary credentials and synthetic fixtures
        if: always()
        run: rm -f "$RUNNER_TEMP/resolved-connection.json" "$RUNNER_TEMP/chinese.wav" "$RUNNER_TEMP/english.wav" "$RUNNER_TEMP/interrupt.wav" "$RUNNER_TEMP/mixed-with-pause.wav"
