name: Actual Android app voice diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actual-app-voice-diagnosis
  cancel-in-progress: false

jobs:
  app-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the actual app and instrumentation in Actions
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Prepare emulator microphone client
        run: |
          python -m pip install 'grpcio==1.78.0' 'grpcio-tools==1.78.0'
          mkdir -p "$RUNNER_TEMP/voice-proto"
          cp .github/scripts/emulator-audio.proto "$RUNNER_TEMP/voice-proto/emulator_audio.proto"
          python -m grpc_tools.protoc -I "$RUNNER_TEMP/voice-proto" --python_out="$RUNNER_TEMP/voice-proto" --grpc_python_out="$RUNNER_TEMP/voice-proto" "$RUNNER_TEMP/voice-proto/emulator_audio.proto"
          echo "VOICE_PROTO_DIR=$RUNNER_TEMP/voice-proto" >> "$GITHUB_ENV"
          sudo chmod 666 /dev/kvm
          # A headless audio device keeps Android AudioRecord and speaker output active.
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=voice_test
          pactl set-default-sink voice_test
          # Match Google's headless emulator container audio socket configuration.
          pactl load-module module-native-protocol-unix auth-anonymous=1 socket=/tmp/pulse-socket
          PULSE_SERVER=unix:/tmp/pulse-socket pactl info
          echo 'PULSE_SERVER=unix:/tmp/pulse-socket' >> "$GITHUB_ENV"
          echo 'QEMU_PA_SERVER=unix:/tmp/pulse-socket' >> "$GITHUB_ENV"
      - name: Real UI, microphone, WebRTC, transcription and playback
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_VOICE_TEST_CONFIG: ${{ secrets.ANDROID_VOICE_TEST_CONFIG }}
          QEMU_AUDIO_DRV: pa
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -grpc 8554 -no-snapshot
          script: python .github/scripts/app-voice-e2e.py
      - name: Upload timings, app operation video and synthetic reply audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-app-voice-diagnosis
          path: |
            app/build/voice-e2e/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 7
