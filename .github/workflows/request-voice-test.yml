name: Fast App requests and voice latency

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Measurement label (baseline / tuned)'
        default: baseline
      turns:
        description: 'Number of consecutive conversational turns'
        type: choice
        options: ['1', '3']
        default: '3'

permissions:
  contents: read

concurrency:
  group: fast-request-voice-test
  cancel-in-progress: false

jobs:
  requests-and-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test production App request selection and SDK HTTP requests on JVM
        env:
          VOICE_TEST_CONFIG: ${{ secrets.ANDROID_VOICE_TEST_CONFIG }}
          RESOLVED_CONNECTION_FILE: ${{ runner.temp }}/resolved-connection.json
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon
          test -s "$RUNNER_TEMP/resolved-connection.json"
      - name: Install headless RTC and HTTP clients in Actions
        run: python -m pip install 'livekit==1.1.20' 'aiohttp==3.13.3'
      - name: Measure provider streaming and complete conversation latency
        env:
          VOICE_TEST_CONFIG: ${{ secrets.ANDROID_VOICE_TEST_CONFIG }}
          RESOLVED_CONNECTION_FILE: ${{ runner.temp }}/resolved-connection.json
          VOICE_TEST_TURNS: ${{ inputs.turns }}
          VOICE_TEST_LABEL: ${{ inputs.label }}
        run: python .github/scripts/request-voice-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-voice-${{ inputs.label }}
          path: |
            voice-reports/
            app/build/reports/tests/
            app/build/reports/connection-request.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary connection credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/resolved-connection.json"
