name: Fast App requests and voice latency

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Measurement label (baseline / tuned)'
        default: baseline
      turns:
        description: 'Number of consecutive conversational turns'
        type: choice
        options: ['1', '3', '10']
        default: '3'
      target:
        description: Deployment to measure
        type: choice
        options: ['cloud', 'personal']
        default: cloud
      behavior:
        description: Personal deployment interruption and reconnect checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fast-request-voice-test
  cancel-in-progress: false

jobs:
  requests-and-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test production App request selection and SDK HTTP requests on JVM
        env:
          VOICE_TEST_CONFIG: ${{ secrets[inputs.target == 'personal' && 'PERSONAL_VOICE_TEST_CONFIG' || 'ANDROID_VOICE_TEST_CONFIG'] }}
          RESOLVED_CONNECTION_FILE: ${{ runner.temp }}/resolved-connection.json
        run: |
          python - <<'PY'
          import json, os
          config = json.loads(os.environ['VOICE_TEST_CONFIG'])
          for secret in (config.get('token_endpoint'), config.get('token'),
                         config['tts']['api_key'], (config.get('llm') or {}).get('api_key')):
              if secret:
                  print('::add-mask::' + secret)
          PY
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon
          test -s "$RUNNER_TEMP/resolved-connection.json"
      - name: Install headless RTC and HTTP clients in Actions
        run: python -m pip install 'livekit==1.1.20' 'aiohttp==3.13.3'
      - name: Measure provider streaming and complete conversation latency
        env:
          VOICE_TEST_CONFIG: ${{ secrets[inputs.target == 'personal' && 'PERSONAL_VOICE_TEST_CONFIG' || 'ANDROID_VOICE_TEST_CONFIG'] }}
          RESOLVED_CONNECTION_FILE: ${{ runner.temp }}/resolved-connection.json
          VOICE_TEST_TURNS: ${{ inputs.turns }}
          VOICE_TEST_LABEL: ${{ inputs.label }}
          VOICE_TEST_BEHAVIOR: ${{ inputs.behavior }}
        run: |
          if [ '${{ inputs.target }}' = personal ]; then
            python .github/scripts/personal-voice-test.py
          else
            python .github/scripts/request-voice-test.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-voice-${{ inputs.label }}
          path: |
            voice-reports/
            app/build/reports/tests/
            app/build/reports/connection-request.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary connection credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/resolved-connection.json" "$RUNNER_TEMP/chinese.wav" "$RUNNER_TEMP/english.wav" "$RUNNER_TEMP/interrupt.wav" "$RUNNER_TEMP/mixed-with-pause.wav"
